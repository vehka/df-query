[project]
name = "df-query"
version = "0.1.0"
description = "Web viewer for Dwarf Fortress fortress data, via DFHack"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
df-query = "df_query.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["df_query"]
